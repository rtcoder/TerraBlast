name: Godot headless
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.2
      GODOT_BIN: /tmp/godot/Godot_v4.6.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        shell: bash
        run: |
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --editor --quit'
      - name: Unit and integration tests
        run: python3 tools/run_tests.py --log-dir /tmp/terrablast-ci --report /tmp/terrablast-ci/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-test-results
          path: /tmp/terrablast-ci
